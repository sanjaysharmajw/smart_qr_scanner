name: smart_qr_scanner
description: A production-ready Flutter package for real-time QR code and barcode scanning using Google ML Kit with beautiful modern UI, animations, and advanced features.
version: 1.0.0
homepage: https://github.com/yourusername/smart_qr_scanner
repository: https://github.com/yourusername/smart_qr_scanner
issue_tracker: https://github.com/yourusername/smart_qr_scanner/issues

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_barcode_scanning: ^0.13.0
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  vibration: ^2.0.0
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/sounds/
