name: smart_qr_scanner
description: A production-ready Flutter package for real-time QR code and barcode scanning using Google ML Kit with beautiful modern UI, animations, and advanced features.
version: 1.3.0
homepage: https://github.com/sanjaysharmajw/smart_qr_scanner
repository: https://github.com/sanjaysharmajw/smart_qr_scanner
issue_tracker: https://github.com/sanjaysharmajw/smart_qr_scanner/issues

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_barcode_scanning: ^0.14.2
  camera: ^0.11.0+2
  permission_handler: ^12.0.1
  vibration: ^3.1.8
  image_picker: ^1.2.2
  qr: ^3.0.0
  url_launcher: ^6.3.2
  share_plus: ^10.0.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

